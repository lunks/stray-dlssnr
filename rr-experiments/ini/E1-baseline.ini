[SystemSettings]

; Already True at SetByProjectSetting in the cooked
; Hk_project/Config/DefaultEngine.ini:59 [HW], so this line is a no-op today
; (D2 §7 — the belief that this line "proved Engine.ini works" was wrong).
; Retained because the working add-on depends on the behaviour and nothing
; here may risk it.
r.BasePassOutputsVelocity=1

; MUST STAY 0.  Only the non-ray-cone TMaterialCHS permutations were cooked
; (D2 §2); setting 1 asks for shaders that do not exist.  The CVar is
; ECVF_RenderThreadSafe|ECVF_ReadOnly [SRC ue427rt/DeferredShadingRenderer.cpp:121-128]
; and already defaults to 0 — so this line documents intent and guards against
; a later edit, it is not what holds the value at 0.
r.RayTracing.UseTextureLod=0
