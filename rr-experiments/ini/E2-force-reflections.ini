; ===========================================================================
; E2 — Force ray-traced reflections on, with a channel canary.
;
; RUN ONLY IF E1's dump showed no *.lib.RayTracingReflectionsRGS.spv.
; If E1 already showed it, skip straight to E3.
;
; Tests two things at once, and they are orthogonal so both stay attributable:
;   (a) canary — does [SystemSettings] reach the render thread at all?
;   (b) can ray-traced reflections be forced on?
; ===========================================================================

[SystemSettings]

r.BasePassOutputsVelocity=1
r.RayTracing.UseTextureLod=0

; --- (a) THE CANARY --------------------------------------------------------
; r.RayTracing.Translucency defaults to -1 -> driven by the post-process
; volume, whose FPostProcessSettings default is TranslucencyType=Raster
; [SRC Scene.cpp:582 via D1], so RT translucency is OFF at baseline and
; RayTracingPrimaryRaysRGS was ABSENT from E1's dump.  Setting 1 makes
; ShouldRenderRayTracingTranslucency return true
; [SRC ue427rt/RayTracingTranslucency.cpp:131-142] and the raygen enters the
; material pipeline.
;
; RayTracingPrimaryRaysRGS APPEARS  -> the [SystemSettings] channel is LIVE.
; RayTracingPrimaryRaysRGS ABSENT   -> the channel did not deliver.  Every
;                                      other reading in this launch is void.
;
; ECVF_RenderThreadSafe, not ReadOnly [SRC ue427rt/RayTracingTranslucency.cpp:23-29].
; Cost: RT translucency replaces raster translucency wholesale and is not
; cheap.  That is fine for one census launch; do not leave it on.
r.RayTracing.Translucency=1

; --- (b) FORCE REFLECTIONS -------------------------------------------------
; -1 (default) defers to the PPV; 1 forces on regardless of any level
; PostProcessVolume override, which is the only thing D1 could not rule out.
; ECVF_RenderThreadSafe [SRC ue427rt/RayTracingReflections.cpp:29-36].
r.RayTracing.Reflections=1
; -1 defers to the PPV.  ShouldRenderRayTracingReflections requires
; SamplesPerPixel > 0 [SRC :404], so set it explicitly rather than trusting
; the volume.
r.RayTracing.Reflections.SamplesPerPixel=1

; --- DECONTAMINATION — do not remove these two -----------------------------
; Without them the census is worthless.  PrepareRayTracingReflectionsDeferredMaterial
; adds RayTracingReflectionsRGS WITHOUT checking ShouldRenderRayTracingReflections;
; it checks only ShouldRayTracedReflectionsSortMaterials, which is
; (Hybrid != 0 || SortMaterials != 0) and both default such that it is TRUE
; [SRC ue427rt/RayTracingReflections.cpp:414-417, :487-500; defaults 1 at :139-145
;  and 0 at :147-154].  So at defaults the name appears even with reflections
; OFF.  Setting both to 0 makes that function return early, and then
;   RayTracingReflectionsRGS present  <=>  reflections enabled.
r.RayTracing.Reflections.SortMaterials=0
r.RayTracing.Reflections.Hybrid=0
