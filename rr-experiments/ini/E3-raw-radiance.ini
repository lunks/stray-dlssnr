; ===========================================================================
; E3 — The RR-decisive one: raw, undenoised, specular-albedo-demodulated
;      radiance, on screen, visible.
;
; RUN ONLY once reflections are known to run (E1 showed the raygen, or E2
; forced it on and its canary fired).
;
; With r.Reflections.Denoiser=0, bDenoise is false
; [SRC ue427rt/IndirectLightRendering.cpp:754] and the code takes the final
; else branch, assigning ReflectionsColor = DenoiserInputs.Color [:838] — the
; raw ray generation output, no screen-space denoiser in between.  That buffer
; is then multiplied by EnvBRDF(SpecularColor, Roughness, NoV) in the
; compositing pass, i.e. it is specular-albedo-demodulated incident radiance:
; the signal class DLSS-RR was trained on (D2 §4).
;
; Expected observable: gross Monte-Carlo noise in every reflective surface.
; Stray's wet streets and neon are the best possible test scene for this.
; ===========================================================================

[SystemSettings]

r.BasePassOutputsVelocity=1
r.RayTracing.UseTextureLod=0

r.RayTracing.Reflections=1
r.RayTracing.Reflections.SamplesPerPixel=1
r.RayTracing.Reflections.SortMaterials=0
r.RayTracing.Reflections.Hybrid=0

; Put RT reflections on rough surfaces too, where 1 spp is at its noisiest.
; Clamped to [0.01, 1.0] [SRC ue427rt/RayTracingReflections.cpp:392].
; Drop to 0.6 if the frame rate is unplayable — the test still works, the
; noise is just confined to smoother surfaces.
r.RayTracing.Reflections.MaxRoughness=1.0

; THE LINE THIS EXPERIMENT IS ABOUT.
; Default 2, ECVF_RenderThreadSafe, not ReadOnly
; [SRC ue427rt/ScreenSpaceDenoise.cpp:43-50].
r.Reflections.Denoiser=0
