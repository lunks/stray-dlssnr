; ===========================================================================
; E4 — Ray-traced global illumination: the DIFFUSE-albedo-demodulated signal.
;
; Lower priority than E1-E3.  Only worth a launch if E3 succeeded and the
; diffuse guide is wanted as well as the specular one, or if E3 failed and
; RTGI is the last candidate before declaring RR dead (see VERDICT-CRITERIA §1.3).
;
; RTGI is diffuse-demodulated the same way reflections are specular-demodulated:
; DiffuseIndirectComposite.usf does OutColor.rgb += DiffuseColor * DiffuseIndirectTexture
; (D2 §4), so the texture is radiance over albedo.
; ===========================================================================

[SystemSettings]

r.BasePassOutputsVelocity=1
r.RayTracing.UseTextureLod=0

r.RayTracing.GlobalIllumination=1

; MANDATORY, NOT OPTIONAL.  ShouldRenderRayTracingGlobalIllumination returns
; false when SamplesPerPixel <= 0 *before* it ever reaches
; ShouldRenderRayTracingEffect, so neither this CVar alone nor
; r.RayTracing.ForceAllRayTracingEffects=1 will turn GI on without it
; (D2 §3).  Default is -1 -> driven by the PPV, whose default is
; RayTracingGIType=Disabled.
r.RayTracing.GlobalIllumination.SamplesPerPixel=2

; Same decontamination story as reflections, different function:
; PrepareRayTracingGlobalIlluminationDeferredMaterial adds GlobalIlluminationRGS
; and RayTracingCreateGatherPointsTraceRGS with NO ShouldRender gate at all,
; checking only FinalGather.SortMaterials (default 1)
; [SRC ue427rt/RayTracingGlobalIllumination.cpp:715-724, :170-176].
; Without this line, GlobalIlluminationRGS in the dump means nothing.
r.RayTracing.GlobalIllumination.FinalGather.SortMaterials=0

; Raw, undenoised diffuse indirect.  Both are needed: the RTGI-specific one
; [SRC ue427rt/RayTracingGlobalIllumination.cpp:84-89] and the shared
; diffuse-indirect denoiser [SRC ue427rt/IndirectLightRendering.cpp:26-29].
r.RayTracing.GlobalIllumination.Denoiser=0
r.DiffuseIndirect.Denoiser=0
