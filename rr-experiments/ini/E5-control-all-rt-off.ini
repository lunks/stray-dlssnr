; ===========================================================================
; E5 — CONTROL / TIEBREAKER.  All ray tracing effects forced off.
;
; Run this ONLY if E2 came back ambiguous — i.e. its canary did not fire and
; you cannot tell whether the [SystemSettings] channel is dead or the effects
; are blocked for some other reason.
;
; r.RayTracing.ForceAllRayTracingEffects=0 makes ShouldRenderRayTracingEffect
; return false unconditionally [SRC ue427rt/DeferredShadingRenderer.cpp:2834-2851],
; and every disjunct of AnyRayTracingPassEnabled routes through it except
; SkyLight, the experimental-plugin GI, and the editor-only path-tracing and
; debug view modes [SRC :2813-2832; shadows :155, reflections :406, AO :70,
; SkyLight's exemption at ue427rt/RayTracingSkyLight.cpp:129-143].
; SkyLight is off anyway: r.RayTracing.SkyLight defaults 0, and 0 is not < 0,
; so the branch takes `GRayTracingSkyLight != 0` = false regardless of whether
; the level has a sky light [SRC :136-138].
;
; Therefore AnyRayTracingPassEnabled becomes false, DispatchRayTracingWorldUpdates
; returns before BuildAccelerationStructure [SRC :1055-1067, :1176/:1204], and:
;
;   dump has many .dxbc/.spv but ZERO *.lib.*.spv  -> channel WORKS, RT fully off.
;                                                     E2's negative was real.
;   dump still has OcclusionRGS etc.               -> channel is DEAD.
;                                                     Every E2/E3/E4 negative is void.
;   dump is empty                                  -> measurement failed, learn nothing.
;
; Also the cheapest way to find out what ray tracing currently costs Stray:
; compare frame time against E1.  Expect the vkd3d
; vkd3d_va_map_place_acceleration_structure warnings to stop appearing too,
; though that is weak corroboration only — see README §6.
; ===========================================================================

[SystemSettings]

r.BasePassOutputsVelocity=1
r.RayTracing.UseTextureLod=0

r.RayTracing.ForceAllRayTracingEffects=0
