; stray_dlssnr.ini - configuration for the STRAY DLSS-NR ReShade add-on.
;
; Put this file next to stray_dlssnr.addon64. Every key is optional; the value shown is the
; default that is used when the key (or the whole file) is absent. Lines starting with ';' or '#'
; are comments, and a [section] header is accepted and ignored.
;
; The add-on logs the value of every setting it ends up using into ReShade.log at startup, so the
; log is always the authority on what actually ran.
;
; EVERY KEY IN THIS FILE EXCEPT app_id IS ALSO A LIVE CONTROL IN THE OVERLAY, and can be changed
; without restarting the game - ReShade's Add-ons tab, under this add-on's own entry. Some cost a
; hitch when you change them (anything that has to rebuild the NGX feature, a compute pipeline, or
; load the snippet); the overlay's tooltip for each one says which, and why. Changes made there are
; live immediately but are NOT written back here until you press Save, which rewrites this file in
; place and keeps every comment, blank line, column and your own spelling of colour/color.
;
; The two exceptions are stated where they appear below: app_id, and the 0 -> 1 direction of
; require_trampoline. README section 2 has the full per-key table and the evidence for both.

[stray_dlssnr]

; ---------------------------------------------------------------------------------------------
; Master switch
; ---------------------------------------------------------------------------------------------
; 0 makes the add-on a strict no-op on the render path: no snippet is loaded, no resource is
; created, and the game's dispatches are issued by ReShade exactly as with no add-on present.
;
; LIVE, both directions, from the overlay ("Load the snippet and arm NGX"). Turning it on loads the
; 166 MB snippet on the present thread, so expect one stalled frame. Turning it off releases the
; NGX feature and every texture - which is where the VRAM is - and stops the pass; NGX itself stays
; initialised, deliberately, because NVSDK_NGX_D3D12_Init_Ext is measured to hang when called at
; the wrong moment and this add-on will not call it twice in a session to service a checkbox.
enabled = 1

; The probe's read-only diagnostics (shader census, root-signature dump, bounded SRV dumps).
; They only write to ReShade.log. Set to 0 once the pass is working to quieten the log.
diagnostics = 1

; ---------------------------------------------------------------------------------------------
; The DXR dispatch census
; ---------------------------------------------------------------------------------------------
; Measures which ray tracing effects this build actually runs: the RT shader entry-point names
; the engine compiles (ReShade reads them out of the DXIL RDAT part, so they are the engine's own
; strings - "OcclusionRGS", "RayTracingReflectionsRGS", "AmbientOcclusionRGS", ...), plus one
; bucket per distinct DispatchRays signature with counts, extents and shader-binding-table
; geometry. A summary block goes to ReShade.log every rt_census_frames presents and again at
; device teardown, so ONE log read answers "which effects dispatched, how often, at what
; resolution".
;
; DEFAULTS OFF. With rt_census = 0 every census entry point returns after one atomic load:
; nothing is counted, named, logged or allocated, the dispatch_rays handler returns false and
; ReShade issues the game's DispatchRays exactly as it would with no add-on present. This is
; read-only instrumentation either way - it creates no resource and issues no command.
;
; It is gated ONLY by this key, not by `enabled` above, so you can measure the title's ray
; tracing with the DLSS-NR pass switched off.
rt_census = 0

; Presents between RT census summary blocks. 600 is about ten seconds at 60 fps.
rt_census_frames = 600

; ---------------------------------------------------------------------------------------------
; Identification
; ---------------------------------------------------------------------------------------------
; The PRIMARY measured TAA shader in STRAY (compute, sm 5.0).
;   t0 depth r32_g8_typeless, t2 velocity r16g16b16a16_unorm, t5/t6 colour r16g16b16a16_float.
; The SECOND measured candidate is 0x52101a15e1a0c5cc; to use it instead, set:
;   shader_hash = 0x52101a15e1a0c5cc
;   srv_velocity = 3
;   srv_colour   = 7
; 0 means "any compute shader that passes every census gate". NOT recommended - it gives up the
; one identifier that is exact. The SRV class quorum still applies either way.
shader_hash = 0x1708ec956099e259

; Which t-registers carry the three guides on that shader.
srv_depth    = 0
srv_velocity = 2
srv_colour   = 5

; Which u-register the TAA pass writes its RESOLVED colour to. This is the buffer that is
; denoised and copied back over. UE 4.27's FTAAStandaloneCS declares OutComputeTex at u0.
; If the add-on logs "the configured output register uN is not a usable TAA output", it will also
; list every candidate it did find - set this to one of those.
uav_output = 0

; ---------------------------------------------------------------------------------------------
; Pipeline behaviour
; ---------------------------------------------------------------------------------------------
; Copy the denoised result back over the game's TAA output.
;
; SET THIS TO 0 FOR THE FIRST RUN. With copy_back=0 the entire path still executes - barriers,
; CreateFeature, EvaluateFeature, the D3D12 state restore - but the result is written to a
; texture nothing reads. A frame that still renders correctly is then positive evidence that the
; state restore is faithful, independent of image quality. Only turn it on once that holds.
;
; IT ALSO FEEDS BACK - and history_restore below is what now fixes that. The resource written here
; is the TAA compute output, which UE 4.27 extracts as the NEXT frame's TAA history, so with
; copy_back=1 and history_restore=0 the denoised image re-enters both the game's temporal
; accumulator and the snippet's own history and the effect compounds over seconds. The add-on logs
; a one-shot "TEMPORAL FEEDBACK" warning when it detects the ping-pong either way; with
; history_restore=1 that message also says the loop is being mitigated. See README gap 5.
copy_back = 1

; ---------------------------------------------------------------------------------------------
; The HDR colour codec  (NEW - ported from the working dxvk-remix rtx.neuralRendering deployment)
; ---------------------------------------------------------------------------------------------
; DLSS-NR is a DISPLAY-REFERRED image network. What gets bound as DLSSNR.Color is UE4 SceneColor:
; linear, unbounded, upstream of bloom, eye adaptation and the film tone curve. Feeding unbounded
; linear radiance to it is out-of-distribution, and darkening is the expected response - this is
; the "a bit dark" symptom, and the same defect that produced blue/red frames in Remix before it
; was fixed there.
;
; With hdr_codec=1 the pass wraps the evaluate in two compute dispatches of its own:
;     proxy  = SrgbEncode(SoftClip(original * s))      <- and the PROXY becomes DLSSNR.Color
;     result = original + (neural - proxy) / s         <- an additive residual, alpha from the
;                                                          ORIGINAL and never from the network
; The transfer is EXACT: if the network returns its input unchanged the residual is exactly +0.0
; and the pixel comes back bit for bit. The shaders are compiled at load with D3DCompile to cs_5_0
; DXBC; if that is not possible the codec latches OFF, says why in the log, and the add-on runs
; exactly as it did before the codec existed.
;
; 0 restores the previous behaviour exactly: the raw TAA output is DLSSNR.Color and the network's
; answer is copied straight back.
hdr_codec = 1

; The scene-linear -> display-referred scale, s.
;
; THIS VALUE IS UNCALIBRATED AND NEEDS TUNING ON HARDWARE. There is no measurement behind the
; default. Remix folds its own auto-exposure and user EV bias into s; STRAY exposes no equivalent
; to this add-on, so it is a plain constant.
;
; SEMANTICS ARE REMIX'S: this is a DIVISOR.  s = 1.0 / max(paper_white_scale, 0.01)
;   * RAISE it   if the image looks blown out - highlights crushed into the soft-clip shoulder.
;   * LOWER it   if the image looks black.
; At the default of 1.0 the divisor and multiplier conventions coincide exactly, so 1.0 means
; "no rescale" either way. Useful range is roughly 0.01 .. 64.
paper_white_scale = 1.0

; How much of the network's change to keep, as a global lerp back toward the untouched original.
;
; 0.0 IS AN EXACT BYPASS OF THE DENOISE - result = lerp(original, graded, 0) = original, bit for
; bit. It is NOT a bypass of the codec: the encode, the evaluate and the decode all still run and
; the copy-back still writes the result over the frame. So a run with transfer_strength=0 must be
; PIXEL-IDENTICAL to a run with copy_back=0 (or with the add-on unloaded).
;
; It is NOT identical to hdr_codec=0. That is a different image: hdr_codec=0 binds the raw linear
; TAA output as DLSSNR.Color and copies the network's raw display-referred answer straight back -
; the darkened frame this codec exists to fix.
;
; transfer_strength=0 vs copy_back=0 is the cheapest on-hardware check that the whole codec path
; is wired up correctly, and it is worth doing once: it exercises the encode, the evaluate, the
; decode, the D3D12 state save/restore and the copy-back end to end.
transfer_strength = 1.0

; 0.0 keeps the original's chromaticity exactly and transfers only the network's LUMINANCE change;
; 1.0 takes the network's colour as well. Lower this if the image picks up a colour cast.
;
; NOT ORTHOGONAL TO hdr_graft BELOW, AND NOT A CONTROL FOR IT. At 0.0 both grafts reduce to
; "rescale the original to the new luminance" and their new luminances are the same number, so on
; ORDINARY pixels they agree to well under one 8-bit code value. They do NOT agree in SHADOWS:
; mode 0 has a chroma floor below Y = 0.001/s and mode 1 has none at all. Measured over 400,000
; dark chromatic pixels at color_strength = 0: worst 27.6 code values, 42.5% of them 2 or more.
; So A/B the grafts at 1.0 for the HIGHLIGHT difference and at 0.0 on a dark, coloured area for
; the SHADOW difference. Neither setting shows both.
color_strength = 1.0

; WHICH GRAFT-BACK the decode uses. LIVE - it is a root constant in the decode's constant block,
; so the overlay can flip it mid-frame with nothing to rebuild.
;
; The ENCODE is the same either way - same exact piecewise sRGB, same soft-clip knee 0.75 and
; shoulder 5.770780 - so the network is shown the same proxy and returns the same answer. ONLY the
; way that answer is carried back onto the untouched HDR original differs.
;
;   0  ADDITIVE (ours, the DEFAULT)
;        result = original + (neural - proxy) / s
;      A scene-linear residual. Exactly +0.0 when the network asked for nothing, which is what
;      makes transfer_strength=0 a BIT-EXACT no-op at EVERY paper_white_scale. RGB is scaled
;      uniformly, so the original's hue cannot drift.
;
;   1  RENODX UpgradeToneMap, reproduced from the reference add-on's own embedded HLSL
;        original_y < proxy_y : ratio = original_y / proxy_y
;        else                 : ratio = (neural_y + max(0, original_y - proxy_y)) / neural_y
;        result = lerp(original, HueOkLab(neural * ratio, neural), transfer_strength)
;      It REBUILDS the pixel from the network's answer and hue-locks it to the NEURAL's hue in
;      OkLab, with an AP1 negative clamp.
;
; WHAT THE TRADE ACTUALLY IS - measured, not assumed (tools/hdr_codec_selftest.cpp). Luminance is
; linear, so their headroom term max(0, original_y - proxy_y) is ALGEBRAICALLY our additive
; residual: both modes deliver the SAME luminance gain at every source magnitude, to 4 decimals.
; The entire difference is CHROMA, and it has two halves at opposite ends of color_strength:
;   HIGHLIGHTS, at color_strength = 1. Where the soft clip has crushed the proxy to white the
;   network's answer is neutral, so mode 1 hue-locks to that neutral and drags a clipped highlight
;   toward the white point; mode 0 leaves its chromaticity exactly alone.
;   SHADOWS, at color_strength = 0. Mode 0's chroma floor hands a near-black pixel over to the
;   network's colour below Y = 0.001/s; mode 1 has no floor and rescales the original's
;   chromaticity by an unbounded ratio. Worst 27.6 code values over 400,000 dark chromatic pixels.
;
; SO THIS IS A COLOUR EXPERIMENT, NOT A HIGHLIGHT FIX. Neither mode recovers a bright highlight,
; and the ceiling is lower than the soft clip suggests: the proxy is stored in an FP16 surface, so
; the encoded proxy quantises to exactly 1.0 at 1.81x paper white - 3.47x is the FP32 number and is
; not the one that governs - and of a requested +30% gain the decode already delivers only ~50% at
; 1.15x and ~5% at 1.86x. Those ratios are to PAPER WHITE and do not move with paper_white_scale;
; the scene-linear magnitude they land at moves in proportion (at 4.0, full gain reaches magnitude
; 3.17 instead of 0.79). If highlights are being lost, the knee is in the wrong place - that is
; exactly what paper_white_scale is for.
;
; Mode 1 is also NOT an exact bypass at transfer_strength=0: it works display-referred throughout,
; so the result is (original * s) / s, exact only when s is a power of two (paper_white_scale 1.0,
; 2.0, 0.5, ...). Mode 0 is exact at every value. That is why 0 is the default, and why the
; transfer_strength=0 identity check should be run on mode 0.
;
; Only 0 and 1 exist; anything else is read as 1. Two ways this key can be ignored, and both are
; said out loud in ReShade.log and in the overlay rather than left to be discovered: if the decode
; could not be compiled WITH the reference graft on this machine the add-on falls back to a build
; without it and pins this to 0 (mode 0, the default, is unaffected - that fallback is there so a
; compiler that cannot build the experiment cannot take the shipping path down with it); and if a
; user-supplied stray_dlssnr_decode.dxbc is in use, that blob may not read this constant at all.
hdr_graft = 0

; ---------------------------------------------------------------------------------------------
; Temporal feedback  (NEW - the fix for README gap 5)
; ---------------------------------------------------------------------------------------------
; UE 4.27's AddTemporalAAPass creates ONE texture and uses it as both the pass output and the next
; frame's history (TemporalAA.cpp:696 is literally
;   NewHistoryTexture[0] = Outputs.SceneColor = NewHistoryTexture[0];
; and :969 queues that same texture for extraction into OutputHistory->RT[0]). The history weight
; is 0.96 per frame (r.TemporalAACurrentFrameWeight = .04), so a denoised image written into it is
; re-denoised roughly 25 times before it decays out. That is the over-smoothing and ghosting that
; "builds up over seconds".
;
; With history_restore=1 the add-on keeps a private copy of the PRE-denoise TAA output and writes
; it back over that resource at the start of the next accepted TAA dispatch - but only after
; confirming the resource really is resolved as a colour SRV at that dispatch, i.e. that it really
; is this frame's history. If it is not, nothing is written, the copy is dropped, and the log says
; so. The contract: the game's TAA never sees a denoised pixel, and post-processing only ever sees
; denoised pixels.
;
; 0 restores the previous behaviour exactly. This is the knob to A/B on hardware.
; Inert with copy_back=0 (nothing is written back, so there is nothing to undo).
history_restore = 1

; Replay the GRAPHICS root signature and arguments as well as the compute ones after the
; evaluate. NVIDIA's own Streamline shadow restores compute state only, which is an empirical
; statement about the DLSS snippets, not a contract. But the load-bearing reason is the second
; one: the restore itself issues SetDescriptorHeaps, and a descriptor-heap change makes every
; descriptor table undefined on BOTH pipes - so the graphics tables have to be re-set even on the
; assumption that NGX only ever dirties compute state.
;
; That makes 0 a DIAGNOSTIC setting, not a safer one: it leaves the graphics tables invalidated by
; our own heap re-bind, and UE 4.27's dirty-flag state cache will not repair them. Turn it off only
; to test whether the graphics replay is itself causing harm, and expect corruption if it is not.
restore_graphics_root = 1

; Refuse to run without remix_nvngx.dll. The snippet's caller gate cannot be detected at resolve
; time (GetProcAddress succeeds; only the calls fail with 0xbad00002), so leaving this on buys a
; clear error message instead of a silent failure.
;
; HALF LIVE. 1 -> 0 works from the overlay and is the direction that matters: it only has an effect
; in the session where the snippet refused to load for exactly this reason, and on that path
; load_snippet already unloaded everything, so re-running it is clean. 0 -> 1 needs a relaunch when
; the snippet is already loaded, because honouring it would mean unloading an initialised snippet
; and there is no in-process unload path anywhere in this add-on - it declines to FreeLibrary even
; at device teardown, since a 166 MB module may still hold worker threads.
require_trampoline = 1

; Call the snippet's own PopulateParameters_Impl after allocating the parameter block. It is a
; gated export whose exact signature has not been verified against this snippet build, and
; nothing in the documented flow needs it.
populate_parameters = 0

; ---------------------------------------------------------------------------------------------
; NGX evaluate parameters
; ---------------------------------------------------------------------------------------------
; UE 4.27 uses a REVERSED-Z depth buffer, so this defaults to 1. Note this is the OPPOSITE of the
; working Remix deployment, whose renderer writes non-inverted NDC depth. This value is inferred
; from the engine, not measured in STRAY - if the denoise ghosts or smears in exactly the wrong
; direction, flip it first.
depth_inverted = 1

; ---------------------------------------------------------------------------------------------
; The motion-vector decode  (README gap 2)
; ---------------------------------------------------------------------------------------------
; UE4 writes screen-space velocity into a normalised-integer texture with a SCALE AND A BIAS, and
; only where it decided to; everywhere else the texel is exactly the cleared (0,0,0,0) and UE's
; own TAA reconstructs camera motion by reprojecting depth through View.ClipToPrevClip. With this
; on, a compute pass does both and writes ABSOLUTE PIXELS ON THE COLOUR GRID, y-down, in the
; direction DLSS wants (add the vector to a pixel to get where it was last frame). MVecScaleX/Y
; are then FORCED to 1.0 so the grid correction cannot double-apply.
;
; 0 restores the previous behaviour EXACTLY: the game's raw encoded velocity is bound as
; DLSSNR.MVec with the derived grid ratio, and the gap-2 warning is printed. That is the A/B.
; Every failure path also lands there - the pass can never make the add-on worse than mvec_decode=0.
mvec_decode = 1

; Reconstruct camera motion from depth where the velocity texel is invalid (raw .x == 0).
; THIS IS MOST OF THE FRAME: static geometry never writes velocity, even with
; r.BasePassOutputsVelocity=1 - that setting moves velocity output into the base pass for MOVABLE
; primitives, it does not make static ones write. Sky, translucency, particles and any movable
; that did not move this frame are all zero too.
;
; 0 = decode only: valid texels decoded, invalid texels written as EXACTLY ZERO. That is strictly
; a bring-up A/B for isolating the two halves on hardware; shipping it hands DLSS zero motion for
; the entire static world, which is WORSE than mvec_decode=0.
mvec_reconstruct = 1

; UE's own TAA dilates the velocity lookup to the nearest-depth neighbour in a 2px cross for its
; single-tap history. DLSS does its own neighbourhood work, so pre-dilating tends to smear
; silhouettes - NVIDIA's own plugin defaults to the non-dilated branch. Off, behind its own key so
; it can be A/B'd independently of the encoding fix.
mvec_dilate = 0

; ESCAPE HATCHES. All three exist to turn a SILENT failure into a 30-second experiment.
;
; Pin the float4 row of View.ClipToPrevClip. 0 = discover it from the constant buffer's content
; signature AND cross-check it against this game's own TAA bytecode, refusing to run if the two
; disagree (STRAY measures 122 both ways). A pinned row BYPASSES that cross-check, so it is logged
; loudly - the same posture as shader_hash=0.
mvec_clip_row = 0

; Read ClipToPrevClip transposed. The four rows are passed to the shader untransposed because that
; is what FMatrix's memory layout and UE's mul(v, M) say, and a native replay on the build host
; confirms the untransposed form reproduces ground truth while the transposed one is wrong by
; ~0.37 NDC off-centre. Identity is transpose-invariant, so a STILL camera cannot discriminate:
; if motion is correct at screen centre and wrong at the edges, and worse under camera ROLL, try
; this.
mvec_clip_transpose = 0

; 0 = derive from the extents (colour grid / motion-vector grid), which is what the working
; deployment computes. A non-zero value overrides that.
;
; With mvec_decode=0 this corrects the GRID only - it cannot correct UE4's velocity ENCODING, which
; is gap 2. With mvec_decode=1 the derived value is FORCED to exactly 1.0 (the pass already emits
; absolute colour-grid pixels), and these two become the per-axis SIGN A/B: -1 flips one axis
; through NGX's own parameter with no rebuild.
;
; THE SIGN IS THE ONE LINK IN THE CHAIN THAT IS NOT MEASURED. X is negated and Y is not - the two
; flips (DLSS wants previous-minus-current; UE ScreenPos is y-up while the pixel grid is y-down)
; cancel on Y and compound on X. A naive "flip the Y" gets BOTH wrong and still half-works.
;
; TWO DIFFERENT TESTS LIVE HERE, AND ONLY THE SECOND ONE CAN SETTLE THE DIRECTION CONVENTION:
;   * ONE key at -1  -> a PER-AXIS sign error. If the image smears along ONE axis only, flip that
;                       axis here and report which one fixed it.
;   * BOTH keys at -1 TOGETHER -> the DIRECTION CONVENTION itself (previous-minus-current, which is
;                       what the pass emits, versus current-minus-previous). Getting that wrong
;                       negates BOTH axes at once, so NEITHER single-axis flip can reach the
;                       configuration that discriminates and neither single-axis result is
;                       evidence about it. If mvec_scale_x=-1 AND mvec_scale_y=-1 is BETTER than
;                       the default, the direction convention in the pass is inverted - report it,
;                       because the fix belongs in the shader, not in these keys.
mvec_scale_x = 0
mvec_scale_y = 0

; ---------------------------------------------------------------------------------------------
; The five tuning knobs
; ---------------------------------------------------------------------------------------------
; These defaults are the SNIPPET'S OWN fallbacks, recovered from its disassembly: each read is
; followed by a test that substitutes exactly these values when the host supplied nothing.
; 1.0 is therefore the fallback, NOT a calibrated neutral midpoint, and the scale these values
; sit on is not known. Change them one at a time.
intensity                = 1.0
local_tone_strength      = 1.0
local_structure_strength = 1.0

; NEGATIVE means "inherit local_structure_strength", which is what the snippet does on the other
; side of an explicit compare against 0. 0.0 is NOT neutral - it flattens skin structure.
skin_structure_strength  = -1.0

; uint. Only 0 is known to exist in this snippet build.
style = 0

; DLSSNR.UICorrection. A real parameter of this snippet build - the exact string is in
; nvngx_dlssnr.dll's table and it is read with a proper failure guard whose fallback is 0 - but
; what it looks like on STRAY's content has NOT been verified. Treat it as a diagnostic knob.
; Exposed as a live checkbox in the overlay.
ui_correction = 0

; Gates BOTH structure strengths. With this at 0 the snippet internally forces both to -1 and
; neither does anything. Binding a ControlMask would also force it to 0 inside the snippet; this
; add-on binds none, so the two never conflict here.
use_auto_mask = 1

; ---------------------------------------------------------------------------------------------
; Misc
; ---------------------------------------------------------------------------------------------
; NGX application id. The snippet resolves its weights from its own embedded resource, so this
; only names the log file it writes beside the add-on.
;
; THE ONE KEY IN THIS FILE THAT IS NOT A LIVE CONTROL, and here is the whole reason. Changing it in
; place would mean NVSDK_NGX_D3D12_Shutdown1 followed by a second Init_Ext. The mechanism exists -
; Shutdown1 is resolved, is required at load, and is already called in-process at device teardown -
; but nothing here has ever measured whether Init_Ext survives a second call, and the ONE thing
; this project has measured about it is that it HANGS when called at a moment the snippet does not
; tolerate: the log stops between "loaded nvngx_dlssnr.dll" and the Init_Ext result, the process
; sits at ~2% CPU, and the title never reaches its menu.
;
; A hang is not a failure that degrades. Since this key changes nothing but the name of a log file,
; an unverified path that can hang the game is the wrong trade. Edit it here and relaunch. The
; overlay says exactly this rather than pretending the key is load-only for some deeper reason.
app_id = 0x24480451

; =============================================================================================
; DLSS SUPER RESOLUTION  (NGX feature 1, nvngx_dlss.dll)
; =============================================================================================
; EVERYTHING BELOW IS INERT UNLESS dlss_sr = 1. With dlss_sr = 0 - the default, and the shipping
; configuration - the add-on behaves exactly as it did before DLSS-SR existed: nvngx_dlss.dll is
; not loaded, no SR resource is created, remix_nvngx.dll's slot B stays null, and the only cost is
; a handful of predictable branches per frame. DLSS-NR is unaffected either way.
;
; Walk STAGING-sr.md. Do not turn several of these on at once - the whole point of the ladder is
; that each rung has exactly one thing that can be wrong.

; The master switch.
dlss_sr = 0

; The DLSS-NR path. 1 = today. Set to 0 alongside dlss_sr=1 to skip the 166 MB nvngx_dlssnr.dll
; load entirely when you are only running SR. NOTE: with dlss_sr=1 the SR pass TAKES the accepted
; TAA dispatch and the DLSS-NR evaluate does not run, whether or not its snippet is loaded.
dlss_nr = 1

; ---------------------------------------------------------------------------------------------
; CHAIN MODE - BOTH features on ONE dispatch.  Default 0.
; ---------------------------------------------------------------------------------------------
; dlss_sr=1 and dlss_nr=1 do NOT run both: whoever takes the accepted dispatch owns the frame, and
; that is DLSS-SR. dlss_chain=1 wires them together instead, in the order that is actually correct:
;
;     game TAA dispatch (suppressed)
;       -> codec encode   1920x1080 linear HDR -> display-referred proxy
;       -> DLSS-NR        proxy -> out_tex, at the RENDER extent
;       -> codec decode   the denoised answer grafted back onto the linear original
;       -> DLSS-SR        COLOUR = that denoised 1920x1080 image -> u0 at 3840x2160
;
; DENOISE FIRST, THEN UPSCALE. DLSS-NR alone denoises at 1920x1080 and the game's spatial filter
; then magnifies whatever noise is left into 3840x2160.
;
; WITH THIS AT 0 THE BUILD BEHAVES EXACTLY AS IT DOES TODAY. One bool is parsed; nothing is
; loaded, nothing is allocated, and no GPU work changes.
;
; WHAT IT REQUIRES, and the add-on refuses out loud rather than degrading silently:
;   * dlss_nr = 1 AND nvngx_dlss.dll present, so BOTH snippets arm. If either does not, you get
;     one "DLSS-CHAIN: dlss_chain=1 but the chain cannot run" line naming which, and the run falls
;     back to whichever single feature did arm. It never half-runs.
;   * UE4 in MainUpsampling - Engine.ini [SystemSettings]: r.TemporalAA.Upsampling=1,
;     r.SecondaryScreenPercentage=100, r.ScreenPercentage=50. Without it the TAA output UAV is the
;     same size as the colour input and there is nothing to upscale into; you get one
;     "DLSS-CHAIN: ... this dispatch is NOT an upsampling one" line with the exact block to paste.
;   * sr_shader_hash RE-PINNED for that permutation (it changes the DXBC, so it changes the hash).
;     dlss_chain uses sr_shader_hash exactly as dlss_sr does.
;   * hdr_codec = 1. With it off DLSS-SR is handed the network's DISPLAY-REFERRED answer as if it
;     were linear HDR - README gap 1, magnified by the upscaler. Warned about once; not refused.
;
; Every sr_* key below applies in chain mode too. copy_back is IGNORED (DLSS-NR's result is at the
; render extent and u0 is at the output extent - a full-subresource copy between mismatched
; extents is invalid usage, not an error), and history_restore is INERT with it.
;
; THE CHEAPEST CHECK THAT THE PLUMBING IS RIGHT: transfer_strength=0 must be PIXEL-IDENTICAL to
; dlss_chain=0/dlss_sr=1 at the same ini. Proof that it RAN: "DLSS-CHAIN: CHAINED EVALUATE #1 OK"
; and the census line "--- DLSS-CHAIN @ frame N: chained=...".
dlss_chain = 0

; ---------------------------------------------------------------------------------------------
; Identification - THE ONE-LINE RE-PIN
; ---------------------------------------------------------------------------------------------
; TAA_PASS_CONFIG and TAA_SCREEN_PERCENTAGE_RANGE are #defines, so flipping
; r.TemporalAA.Upsampling, or dropping r.ScreenPercentage below 100, produces different DXBC and a
; different fnv1a64. The ONLY symptom is "DLSS-NR: pass did not run - this dispatch is not the
; target shader" in the log.
;
; Put the MainUpsampling permutation's hash here. shader_hash above keeps DLSS-NR's own pin, so
; both features can be A/B'd on one install. 0 = fall back to shader_hash.
sr_shader_hash = 0

; ---------------------------------------------------------------------------------------------
; Geometry
; ---------------------------------------------------------------------------------------------
; The OUTPUT extent. 0 = derive it from the dispatch's group counts, which is correct by
; construction (TemporalAA.cpp:958 dispatches GetGroupCount(DestRect.Size(), 8), and GetGroupCount
; is DivideAndRoundUp). Pin these only if the log's "OUTPUT EXTENT" line disagrees with the u0
; texture it also prints.
sr_out_width  = 0
sr_out_height = 0

; GTemporalAATileSizeX/Y. An engine compile-time constant; here so a licensee edit is an ini change.
sr_group_tile = 8

; Feed DLSS the VIEW RECT from ViewSizeAndInvSize rather than the colour texture's extent. They
; differ whenever QuantizeSceneBufferSize rounded up (to a multiple of 4) - e.g. 1130 vs 1132 at
; r.ScreenPercentage=58.8, which is a silent ~0.2% mis-scale plus two columns of uninitialised
; texels inside the sampled region. At 50% and 100% the two are equal, so this is only an A/B there.
sr_use_view_rect = 1

; ---------------------------------------------------------------------------------------------
; The bring-up ladder  (STAGING-sr.md walks these IN THIS ORDER)
; ---------------------------------------------------------------------------------------------
; RUNG 6. Stop re-issuing the game's TAA dispatch. With 0 the game's TAAU still runs and DLSS
; writes on top - one wasted dispatch, and the safest possible shape. With 1 the dispatch is
; suppressed. Ownership is reported to ReShade only AFTER a successful EvaluateFeature AND after
; the D3D12 state restore, so every failure path leaves ReShade to issue the game's own TAAU,
; which unconditionally writes every pixel of the output view rect - a correct frame.
;
; NOTE: ReShade's event dispatch does not short-circuit, so this suppression applies to EVERY
; co-loaded add-on and they have no way to learn it.
sr_suppress_taa = 0

; RUNG 7. Bind the game's own TAA output UAV (u0) directly as DLSS's Output, instead of evaluating
; into an add-on texture and copying back. Removes a full-extent 4K copy per frame and both of its
; barriers.
sr_direct_output = 0

; Write the add-on's SR output back over u0. Inert with sr_direct_output=1.
;
; SET THIS TO 0 FOR THE FIRST SR RUN. The whole path still executes - jitter, decode, CreateFeature,
; EvaluateFeature, the state restore - into a texture nothing reads, so a frame that still renders
; correctly is positive evidence that the state restore is faithful, independent of image quality.
sr_copy_back = 1

; ---------------------------------------------------------------------------------------------
; Motion vectors
; ---------------------------------------------------------------------------------------------
; Reuse the mvec_decode pass to build DLSS's MotionVectors input. The pipeline is SHARED with the
; DLSS-NR path; only the target texture is SR's own, and it is allocated at the RENDER extent
; because SR's colour input is the TAA pass's INPUT (t5), not its output. 0 binds the game's raw
; encoded velocity, which for SR is worse than it is for NR - there is no second temporal filter
; behind it.
sr_mvec_decode = 1

; Reconstruct camera motion from depth through View.ClipToPrevClip wherever UE4 left the velocity
; texel invalid. The same key mvec_reconstruct is above for DLSS-NR, and it exists for the same
; reason: decode-only must only ever be reached because you ASKED for it. 0 writes EXACTLY ZERO
; motion for the whole static world, the sky and translucency - a bring-up A/B for isolating the
; decode from the reconstruction, and worse than sr_mvec_decode=0 for actual play. A
; ClipToPrevClip that cannot be located or validated falls back to the RAW buffer, not to this.
sr_mvec_reconstruct = 1

; MV.Scale.X / MV.Scale.Y. 0 = derive (exactly 1.0 with the decode on). Same two tests as
; mvec_scale_x/y above: ONE key at -1 is a per-axis sign error, BOTH at -1 together is the
; direction convention.
sr_mv_scale_x = 0
sr_mv_scale_y = 0

; ---------------------------------------------------------------------------------------------
; Jitter  -  Jitter.Offset.X/Y are UNCONDITIONALLY REQUIRED by the snippet
; ---------------------------------------------------------------------------------------------
; THE SIGN A/B, and a flipped Y is the single most likely bug in this feature: DLSS runs, reports
; success, and shimmers. The shipped value is the engine's own float with NO arithmetic applied
; (ue4_jitter tier `full`), so 1.0 / 1.0 is the value with evidence behind it. These exist so the
; alternative can be tested without a rebuild.
sr_jitter_scale_x = 1.0
sr_jitter_scale_y = 1.0

; Accept ue4_jitter's WEAKEST tier (matrix pair only, extent from the caller) when
; TemporalAAParams does not validate. The number is still correct; it just has no second opinion.
; Off by default - a failure should be diagnosed from the log line, not downgraded blindly.
sr_jitter_projection_only = 0

; ---------------------------------------------------------------------------------------------
; DLSS.Feature.Create.Flags  -  all CREATE-time; changing one rebuilds the feature
; ---------------------------------------------------------------------------------------------
; Bit 0. IsHDR is NOT an exposure gate - it SELECTS A DIFFERENT TRAINED NETWORK, exactly like
; DepthInverted and MVLowRes. nvngx_dlss.dll ships PAIRED _hdr_/_ldr_ CUDA kernels for every other
; combination (hiluma_engine_{input,output}_depth{inv,reg}_mv{lo,hi}_{hdr,ldr}_v{1,2}_rel, 44 names
; at 0x12f9f8-0x1301b8), and its loader registers each under a descriptor word in which IsHDR sits
; in the same four bytes as MVLowRes and DepthInverted (.text 0x18004f87d-0x18005082f).
; DLSS-SR binds STRAY's t5 SceneColor - r16g16b16a16_float, linear, unbounded, upstream of bloom,
; eye adaptation and the film tone curve, with no codec in front of it. That is HDR input, so this
; is 1. At 0 the LDR network runs on out-of-distribution data: EvaluateFeature returns Success,
; nothing warns, and the image is wrong in the way README gap 1 describes.
; Setting it creates no exposure obligation: this add-on writes neither DLSS.Pre.Exposure nor
; DLSS.Exposure.Scale, and the snippet's own miss-default for both is 1.0f.
; Set to 0 only as a deliberate A/B.
sr_hdr = 1

; Bit 1. Velocity lives at the render resolution, which under any real upscale is lower than the
; output. Clear it at 1:1 (DLAA).
sr_mv_lowres = 1

; Bit 2. UE4's velocity buffer is not jitter-compensated. [ASSUMED]; never measured.
sr_mv_jittered = 0

; Bit 3. UE 4.27 renders reversed-Z. Measured for STRAY. Separate from depth_inverted above so the
; two features can be A/B'd independently.
sr_depth_inverted = 1

; Bit 6. Set by default, because the alternative is owing DLSS an ExposureTexture or a calibrated
; DLSS.Pre.Exposure and UE's pre-exposure is a real source of silent brightness error.
sr_auto_exposure = 1

; Bit 7. Off.
sr_alpha_upscaling = 0

; ---------------------------------------------------------------------------------------------
; Other CreateFeature parameters
; ---------------------------------------------------------------------------------------------
; DLSS.Use.HW.Depth. NOT a create flag - a separate CREATE-TIME parameter, and setting it at
; evaluate is a documented no-op. STRAY's t0 is an r32_g8_typeless HARDWARE depth-stencil, so 1 is
; correct; the snippet's default is 0 = Linear and getting it wrong produces NO diagnostic at all.
; Do not confuse it with sr_depth_inverted: one selects the content convention, the other the sign.
sr_hw_depth = 1

; PerfQualityValue. 0=MaxPerf 1=Balanced 2=MaxQuality 3=UltraPerformance 4=UltraQuality 5=DLAA.
; It does NOT choose the render preset - the snippet picks that slot from Width/OutWidth - and an
; absent value defaults to 0, which is right for 1920->3840 and wrong for DLAA. Set it to 5 when
; you run r.ScreenPercentage=100.
sr_perf_quality = 0

; DLSS.Hint.Render.Preset.* value, written into the ONE slot the ratio selects. 0 = auto.
sr_render_preset = 0

; ---------------------------------------------------------------------------------------------
; Diagnostics
; ---------------------------------------------------------------------------------------------
; Run DLSS_GetOptimalSettings once, on a SCRATCH parameter block, purely to LOG the recommended
; render resolution. It has no power to make UE render at that resolution - r.ScreenPercentage is
; the only lever - so it is never on the critical path.
sr_optimal_settings = 0
